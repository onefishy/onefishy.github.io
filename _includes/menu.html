{% assign menu = site.data.menu %}

{% if menu %}
  <nav class="site-navigation" role="navigation">
    <ul>
      <li data-anchor="top">
        <a href="#top">
          Home
        </a>
      </li>
    {% for item in site.data.menu %}
      {% assign anchor = item.url | remove: '#' %}
      <li data-anchor="{{ anchor }}">
        <a href="{{ item.url }}">
          {{ item.title }}
        </a>
      </li>
    {% endfor %}
    </ul>
  </nav>
{% endif %}
