<svg class="teaching-course-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 520" width="565" height="520" role="img" aria-labelledby="cd-title cd-desc" preserveAspectRatio="xMidYMid meet">
  <title id="cd-title">Courses across subjects and levels</title>
  <desc id="cd-desc">Thirty course entries are positioned along four subject directions and across three nested teaching levels. Hovering over a course mark shows its full title and institution.</desc>

  <style>
    .teaching-course-map {
      --teaching-map-ink: #4c473f;
      --teaching-map-muted: #736f69;
      --teaching-map-background: #c6cdc6;
      --teaching-map-math: #2563eb;
      --teaching-map-cs: #0f8a7a;
      --teaching-map-ml: #7c4dcc;
      --teaching-map-society: #d97706;
    }

    .teaching-course-map .cd-level-outer,
    .teaching-course-map .cd-level-middle,
    .teaching-course-map .cd-level-inner {
      fill: none;
      stroke: var(--teaching-map-ink);
    }

    .teaching-course-map .cd-level-outer { stroke-opacity: 0.28; stroke-width: 1.5; }
    .teaching-course-map .cd-level-middle { stroke-opacity: 0.36; stroke-width: 1.5; }
    .teaching-course-map .cd-level-inner { stroke-opacity: 0.46; stroke-width: 1.5; }

    .teaching-course-map .cd-axis {
      fill: none;
      stroke-width: 1.4;
      stroke-opacity: 0.52;
    }

    .teaching-course-map .cd-axis-math { stroke: var(--teaching-map-math); }
    .teaching-course-map .cd-axis-cs { stroke: var(--teaching-map-cs); }
    .teaching-course-map .cd-axis-ml { stroke: var(--teaching-map-ml); }
    .teaching-course-map .cd-axis-society { stroke: var(--teaching-map-society); }

    .teaching-course-map text {
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
    }

    .teaching-course-map .cd-subject-label {
      font-size: 23px;
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    .teaching-course-map .cd-label-math { fill: var(--teaching-map-math); }
    .teaching-course-map .cd-label-cs { fill: var(--teaching-map-cs); }
    .teaching-course-map .cd-label-ml { fill: var(--teaching-map-ml); }
    .teaching-course-map .cd-label-society { fill: var(--teaching-map-society); }

    .teaching-course-map .cd-level-label {
      fill: var(--teaching-map-muted);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.2px;
      opacity: 0.85;
      text-anchor: start;
    }

    .teaching-course-map .cd-course {
      stroke: var(--teaching-map-background);
      stroke-width: 2;
      cursor: pointer;
      transition: stroke .12s ease, stroke-width .12s ease;
    }

    .teaching-course-map .cd-course-math { fill: var(--teaching-map-math); }
    .teaching-course-map .cd-course-cs { fill: var(--teaching-map-cs); }
    .teaching-course-map .cd-course-ml { fill: var(--teaching-map-ml); }
    .teaching-course-map .cd-course-society { fill: var(--teaching-map-society); }

    .teaching-course-map [data-course]:hover .cd-course,
    .teaching-course-map [data-course]:focus .cd-course {
      stroke: var(--teaching-map-ink);
      stroke-width: 2.5;
    }

    .teaching-course-map [data-course] {
      outline: none;
    }
  </style>

  <path class="cd-level-outer" d="M110 110 L410 110 L410 410 L110 410 Z"/>
  <path class="cd-level-middle" d="M140 140 L380 140 L380 380 L140 380 Z"/>
  <path class="cd-level-inner" d="M185 185 L335 185 L335 335 L185 335 Z"/>

  <line class="cd-axis cd-axis-math" x1="260" y1="260" x2="260" y2="100"/>
  <line class="cd-axis cd-axis-cs" x1="260" y1="260" x2="420" y2="260"/>
  <line class="cd-axis cd-axis-ml" x1="260" y1="260" x2="260" y2="420"/>
  <line class="cd-axis cd-axis-society" x1="260" y1="260" x2="100" y2="260"/>

  <text class="cd-subject-label cd-label-math" x="260" y="90" text-anchor="middle">Math</text>
  <text class="cd-subject-label cd-label-cs" x="430" y="250" text-anchor="start">
    <tspan x="430" dy="0">Computer</tspan>
    <tspan x="430" dy="24">Science</tspan>
  </text>
  <text class="cd-subject-label cd-label-ml" x="260" y="452" text-anchor="middle">Data + ML</text>
  <text class="cd-subject-label cd-label-society" x="90" y="267" text-anchor="end">Society</text>

  <text class="cd-level-label" x="116" y="129">research</text>
  <text class="cd-level-label" x="146" y="159">advanced</text>
  <text class="cd-level-label" x="191" y="204">foundational</text>

  <g aria-label="Foundational mathematics courses">
    <g tabindex="0" aria-label="Fundamental Math Concepts I, Saint Mary's College of California" data-course="Fundamental Math Concepts I" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="220" cy="228" r="6.5"/></g>
    <g tabindex="0" aria-label="Finite Mathematics, Saint Mary's College of California" data-course="Finite Mathematics" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="246" cy="228" r="6.5"/></g>
    <g tabindex="0" aria-label="The Art and Practice of Math, Saint Mary's College of California" data-course="The Art &amp; Practice of Math" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="274" cy="228" r="6.5"/></g>
    <g tabindex="0" aria-label="Game Theory, Voting Theory and Apportionment, Saint Mary's College of California" data-course="Game Theory, Voting Theory &amp; Apportionment" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="300" cy="228" r="6.5"/></g>
    <g tabindex="0" aria-label="Calculus I and II, Saint Mary's College of California" data-course="Calculus I &amp; II" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="236" cy="248" r="6.5"/></g>
    <g tabindex="0" aria-label="Introduction to Calculus I and II, Wesleyan University" data-course="Introduction to Calculus I &amp; II" data-institution="Wesleyan University"><circle class="cd-course cd-course-math" cx="284" cy="248" r="6.5"/></g>
  </g>

  <g aria-label="Advanced mathematics courses">
    <g tabindex="0" aria-label="Mathematical Modeling, Saint Mary's College of California" data-course="Mathematical Modeling" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="225" cy="170" r="6.5"/></g>
    <g tabindex="0" aria-label="Linear Algebra, Saint Mary's College of California" data-course="Linear Algebra" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="250" cy="170" r="6.5"/></g>
    <g tabindex="0" aria-label="Topology, Saint Mary's College of California" data-course="Topology" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="275" cy="170" r="6.5"/></g>
    <g tabindex="0" aria-label="Abstract Algebra I and II, Saint Mary's College of California" data-course="Abstract Algebra I &amp; II" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="300" cy="170" r="6.5"/></g>
    <g tabindex="0" aria-label="Category Theory, Saint Mary's College of California" data-course="Category Theory" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-math" cx="245" cy="152" r="6.5"/></g>
    <g tabindex="0" aria-label="Categorified Quantum Groups and Applications, University of Göttingen" data-course="Categorified Quantum Groups and Applications" data-institution="University of Göttingen"><circle class="cd-course cd-course-math" cx="285" cy="152" r="6.5"/></g>
  </g>

  <g aria-label="Foundational computer science courses">
    <g tabindex="0" aria-label="Introduction to Programming in Python, Saint Mary's College of California" data-course="Introduction to Programming (Python)" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-cs" cx="318" cy="260" r="6.5"/></g>
  </g>

  <g aria-label="Advanced computer science courses">
    <g tabindex="0" aria-label="Design and Development for iOS, Saint Mary's College of California" data-course="Design and Development for iOS" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-cs" cx="350" cy="220" r="6.5"/></g>
    <g tabindex="0" aria-label="Introduction to Algorithms, Saint Mary's College of California" data-course="Introduction to Algorithms" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-cs" cx="370" cy="240" r="6.5"/></g>
    <g tabindex="0" aria-label="Functional Programming in Swift, Saint Mary's College of California" data-course="Functional Programming in Swift" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-cs" cx="350" cy="260" r="6.5"/></g>
    <g tabindex="0" aria-label="Theory of Computation and Formal Languages, Saint Mary's College of California" data-course="Theory of Computation &amp; Formal Languages" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-cs" cx="370" cy="280" r="6.5"/></g>
    <g tabindex="0" aria-label="Advanced C++ Programming, Mary Baldwin College" data-course="Advanced C++ Programming" data-institution="Mary Baldwin College"><circle class="cd-course cd-course-cs" cx="350" cy="300" r="6.5"/></g>
  </g>

  <g aria-label="Foundational data science and machine learning courses">
    <g tabindex="0" aria-label="Introduction to Data Science, Harvard University" data-course="Introduction to Data Science" data-institution="Harvard University"><circle class="cd-course cd-course-ml" cx="238" cy="305" r="6.5"/></g>
    <g tabindex="0" aria-label="Introduction to Machine Learning, Harvard University" data-course="Introduction to Machine Learning" data-institution="Harvard University"><circle class="cd-course cd-course-ml" cx="260" cy="320" r="6.5"/></g>
    <g tabindex="0" aria-label="Data Science Workshop, University of Rwanda" data-course="Data Science Workshop" data-institution="University of Rwanda"><circle class="cd-course cd-course-ml" cx="286" cy="305" r="6.5"/></g>
  </g>

  <g aria-label="Advanced data science and machine learning courses">
    <g tabindex="0" aria-label="Advanced Stochastic Optimization, Harvard University" data-course="Advanced Stochastic Optimization" data-institution="Harvard University"><circle class="cd-course cd-course-ml" cx="245" cy="350" r="6.5"/></g>
    <g tabindex="0" aria-label="Machine Learning and Computational Statistics, University of Rwanda" data-course="Machine Learning and Computational Statistics" data-institution="University of Rwanda"><circle class="cd-course cd-course-ml" cx="280" cy="370" r="6.5"/></g>
  </g>

  <g aria-label="Research data science and machine learning courses">
    <g tabindex="0" aria-label="Computational Science and Engineering Capstone, Harvard University" data-course="Computational Science and Engineering Capstone" data-institution="Harvard University"><circle class="cd-course cd-course-ml" cx="235" cy="400" r="6.5"/></g>
    <g tabindex="0" aria-label="Undergraduate Research in Machine Learning, Harvard University" data-course="Undergraduate Research in Machine Learning" data-institution="Harvard University"><circle class="cd-course cd-course-ml" cx="260" cy="400" r="6.5"/></g>
    <g tabindex="0" aria-label="Graduate Research in Machine Learning, Harvard University" data-course="Graduate Research in Machine Learning" data-institution="Harvard University"><circle class="cd-course cd-course-ml" cx="285" cy="400" r="6.5"/></g>
  </g>

  <g aria-label="Foundational society courses">
    <g tabindex="0" aria-label="Collegiate Seminar I, Saint Mary's College of California" data-course="Collegiate Seminar I" data-institution="Saint Mary's College of California"><circle class="cd-course cd-course-society" cx="202" cy="245" r="6.5"/></g>
    <g tabindex="0" aria-label="Modern China, Mary Baldwin College" data-course="Modern China" data-institution="Mary Baldwin College"><circle class="cd-course cd-course-society" cx="202" cy="278" r="6.5"/></g>
  </g>

  <g aria-label="Advanced society and pedagogy courses">
    <g tabindex="0" aria-label="Diversity, Inclusion and Leadership in Tech, Harvard University" data-course="Diversity, Inclusion and Leadership in Tech" data-institution="Harvard University"><circle class="cd-course cd-course-society" cx="165" cy="245" r="6.5"/></g>
    <g tabindex="0" aria-label="Graduate Pedagogy, Wesleyan University" data-course="Graduate Pedagogy" data-institution="Wesleyan University"><circle class="cd-course cd-course-society" cx="150" cy="280" r="6.5"/></g>
  </g>

  <script><![CDATA[
    (function () {
      var svg = document.currentScript.closest('svg');

      // #course-tooltip lives after this <script> in the document, so it
      // doesn't exist yet when this inline script runs during parsing.
      // Look it up lazily (inside the functions) rather than caching it now.
      function positionTooltip(x, y) {
        var tooltip = document.getElementById('course-tooltip');
        var pad = 16;
        var rect = tooltip.getBoundingClientRect();
        var left = x + pad;
        var top = y + pad;
        if (left + rect.width > window.innerWidth - 8) left = x - rect.width - pad;
        if (top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
      }

      function showTooltip(el, x, y) {
        var tooltip = document.getElementById('course-tooltip');
        tooltip.querySelector('.course-tooltip-title').textContent = el.getAttribute('data-course');
        tooltip.querySelector('.course-tooltip-inst').textContent = el.getAttribute('data-institution');
        tooltip.hidden = false;
        positionTooltip(x, y);
      }

      function hideTooltip() {
        var tooltip = document.getElementById('course-tooltip');
        if (tooltip) tooltip.hidden = true;
      }

      svg.querySelectorAll('[data-course]').forEach(function (el) {
        el.addEventListener('mouseenter', function (e) {
          showTooltip(el, e.clientX, e.clientY);
        });
        el.addEventListener('mousemove', function (e) {
          positionTooltip(e.clientX, e.clientY);
        });
        el.addEventListener('mouseleave', hideTooltip);
        el.addEventListener('focus', function () {
          var r = el.getBoundingClientRect();
          showTooltip(el, r.left + r.width / 2, r.top);
        });
        el.addEventListener('blur', hideTooltip);
      });
    })();
  ]]></script>
</svg>
