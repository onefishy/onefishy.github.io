<svg class="task-level-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1230" width="1400" height="1230" role="img" aria-labelledby="title desc">
  <title id="title">Task-level assurance research map</title>
  <desc id="desc">Nineteen linked publications organized by four task-level questions: model relevant user factors, adapt support, evaluate the joint human-AI system, and bound adaptation so that it remains safe and consensual.</desc>
  <style>
    .task-level-map {
      --ink: #18212f;
      --muted: #5b6775;
      --rule: #d9dee7;
      --link-rule: #9aa5b3;
      --model: #2563eb;
      --adapt: #0f8a7a;
      --evaluate: #7c4dcc;
      --bound: #d97706;
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
    }
    .title { fill: var(--ink); font-size: 29px; font-weight: 500; }
    .note, .axis-label, .question, .insight { fill: var(--muted); }
    .note { font-size: 15px; }
    .axis-label { font-size: 14px; }
    .step { fill: var(--ink); font-size: 15px; font-weight: 500; letter-spacing: 1.5px; }
    .question { font-size: 13px; }
    .group { fill: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: 1.25px; }
    .work { fill: var(--ink); font-size: 16px; }
    .citation { font-weight: 500; }
    .guide, .group-rule { stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .group-rule { opacity: 0.95; }
    .guide { opacity: 0.72; }
    .head-rule { stroke-width: 4; vector-effect: non-scaling-stroke; }
    .model { fill: var(--model); stroke: var(--model); }
    .adapt { fill: var(--adapt); stroke: var(--adapt); }
    .evaluate { fill: var(--evaluate); stroke: var(--evaluate); }
    .bound { fill: var(--bound); stroke: var(--bound); }
    .dot { stroke: none; }
    .work-link { text-decoration: underline; text-decoration-color: var(--link-rule); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .work-link:hover { text-decoration-color: var(--ink); }
  </style>

  <text class="title" x="60" y="58">Task-level assurance</text>
  <text class="note" x="60" y="90">Multiple dots mark works that answer more than one assurance question.</text>
  <text class="axis-label" x="60" y="160">Works and their task-level insights</text>

  <line class="head-rule model" x1="785" y1="126" x2="845" y2="126" />
  <text class="step" x="815" y="153" text-anchor="middle">MODEL</text>
  <text class="question" x="815" y="178" text-anchor="middle"><tspan x="815">Which user factors</tspan><tspan x="815" dy="18">matter?</tspan></text>

  <line class="head-rule adapt" x1="945" y1="126" x2="1005" y2="126" />
  <text class="step" x="975" y="153" text-anchor="middle">ADAPT</text>
  <text class="question" x="975" y="178" text-anchor="middle"><tspan x="975">How should support</tspan><tspan x="975" dy="18">change with the user?</tspan></text>

  <line class="head-rule evaluate" x1="1105" y1="126" x2="1165" y2="126" />
  <text class="step" x="1135" y="153" text-anchor="middle">EVALUATE</text>
  <text class="question" x="1135" y="178" text-anchor="middle"><tspan x="1135">Does the joint system</tspan><tspan x="1135" dy="18">work?</tspan></text>

  <line class="head-rule bound" x1="1265" y1="126" x2="1325" y2="126" />
  <text class="step" x="1295" y="153" text-anchor="middle">BOUND</text>
  <text class="question" x="1295" y="178" text-anchor="middle"><tspan x="1295">Safe and</tspan><tspan x="1295" dy="18">consensual?</tspan></text>

  <line class="guide" x1="815" y1="218" x2="815" y2="1185" />
  <line class="guide" x1="975" y1="218" x2="975" y2="1185" />
  <line class="guide" x1="1135" y1="218" x2="1135" y2="1185" />
  <line class="guide" x1="1295" y1="218" x2="1295" y2="1185" />

