  </a>
  <circle class="dot limit" cx="1135" cy="766" r="6" />

  <a class="work-link" href="https://arxiv.org/abs/2007.07124" target="_blank" rel="noopener noreferrer" aria-label="Failure Modes of Variational Autoencoders and Their Effects on Downstream Tasks">
    <title>Failure Modes of Variational Autoencoders and Their Effects on Downstream Tasks</title>
    <text class="work" x="60" y="814"><tspan class="citation">Yacoby et al. &#8217;20</tspan><tspan class="insight"> &#8212; VAE non-identifiability propagates downstream</tspan></text>
