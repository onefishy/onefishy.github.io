  <circle class="dot validate" cx="975" cy="548" r="6" /><circle class="dot limit" cx="1135" cy="548" r="6" />

  <a class="work-link" href="https://arxiv.org/abs/2211.05667" target="_blank" rel="noopener noreferrer" aria-label="What Makes a Good Explanation? A Harmonized View of Properties of Explanations">
    <title>What Makes a Good Explanation? A Harmonized View of Properties of Explanations</title>
    <text class="work" x="60" y="596"><tspan class="citation">Chen et al. &#8217;22</tspan><tspan class="insight"> &#8212; explanation properties and metric trade-offs</tspan></text>
  </a>
  <circle class="dot define" cx="815" cy="590" r="6" /><circle class="dot validate" cx="975" cy="590" r="6" />

  <a class="work-link" href="https://arxiv.org/abs/2410.23880" target="_blank" rel="noopener noreferrer" aria-label="Directly Optimizing Explanations for Desired Properties">
    <title>Directly Optimizing Explanations for Desired Properties</title>
    <text class="work" x="60" y="638"><tspan class="citation">Tadesse et al. &#8217;25</tspan><tspan class="insight"> &#8212; optimizing explanation trade-offs</tspan></text>
  </a>
  <circle class="dot define" cx="815" cy="632" r="6" /><circle class="dot validate" cx="975" cy="632" r="6" /><circle class="dot control" cx="1295" cy="632" r="6" />

  <line class="group-rule" x1="60" y1="666" x2="1340" y2="666" />
  <text class="group" x="60" y="692">INFERENCE AND FAILURE MODES</text>

  <a class="work-link" href="https://arxiv.org/abs/1906.09686" target="_blank" rel="noopener noreferrer" aria-label="Quality of Uncertainty Quantification for Bayesian Neural Network Inference">
    <title>Quality of Uncertainty Quantification for Bayesian Neural Network Inference</title>
    <text class="work" x="60" y="730"><tspan class="citation">Yao et al. &#8217;19</tspan><tspan class="insight"> &#8212; task-relevant uncertainty quality</tspan></text>
  </a>
  <circle class="dot validate" cx="975" cy="724" r="6" /><circle class="dot limit" cx="1135" cy="724" r="6" />

  <a class="work-link" href="https://proceedings.mlr.press/v151/coker22a.html" target="_blank" rel="noopener noreferrer" aria-label="Wide Mean-Field Bayesian Neural Networks Ignore the Data">
