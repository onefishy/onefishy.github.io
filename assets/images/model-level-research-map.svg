  <circle class="dot limit" cx="1135" cy="892" r="6" /><circle class="dot control" cx="1295" cy="892" r="6" />

  <line class="group-rule" x1="60" y1="926" x2="1340" y2="926" />
  <text class="group" x="60" y="952">STRUCTURED REPRESENTATIONS AND INTERVENTIONS</text>

  <a class="work-link" href="https://arxiv.org/abs/1812.03123" target="_blank" rel="noopener noreferrer" aria-label="Deep Variational Transfer: Transfer Learning through Semi-Supervised Deep Generative Models">
