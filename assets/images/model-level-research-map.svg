  <circle class="dot limit" cx="1135" cy="808" r="6" />

  <a class="work-link" href="https://arxiv.org/abs/2309.00254" target="_blank" rel="noopener noreferrer" aria-label="Why Do Universal Adversarial Attacks Work on Large Language Models? Geometry Might Be the Answer">
    <title>Why Do Universal Adversarial Attacks Work on Large Language Models? Geometry Might Be the Answer</title>
