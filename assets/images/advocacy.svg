<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1140" width="1040" height="1140" role="img" aria-labelledby="ca-title ca-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ca-title">Building collective agency</title>
  <desc id="ca-desc">Twenty-nine outreach, community-building, diversity, equity, inclusion, and advocacy activities are organized along a four-stage pathway: make knowledge usable, enable participation, build community, and change institutions.</desc>

  <style>
    :root {
      --ca-ink: #4c473f;
      --ca-muted: #736f69;
      --ca-background: #eaece7;
      --ca-border: #d0d5dd;
      --ca-stage-1: #2563eb;
      --ca-stage-2: #0f8a7a;
      --ca-stage-3: #7c4dcc;
      --ca-stage-4: #d97706;
    }

    text {
      fill: var(--ca-ink);
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
      font-weight: 400;
    }

    .heading { font-size: 24px; font-weight: 500; }
    .stage-number { font-size: 17px; font-weight: 500; text-anchor: middle; }
    .stage-title { font-size: 20px; font-weight: 500; text-anchor: middle; }
    .principle { fill: var(--ca-muted); font-size: 15px; text-anchor: middle; }
    .activity-name { font-size: 17px; }
    .activity-meta { fill: var(--ca-muted); font-size: 14px; }
    .note { fill: var(--ca-muted); font-size: 14px; }
    .divider { stroke: var(--ca-border); stroke-width: 1; }
    .stage-circle { fill: var(--ca-background); stroke-width: 2.5; }
    .stage-1-stroke { stroke: var(--ca-stage-1); }
    .stage-2-stroke { stroke: var(--ca-stage-2); }
    .stage-3-stroke { stroke: var(--ca-stage-3); }
    .stage-4-stroke { stroke: var(--ca-stage-4); }
    .stage-1-fill { fill: var(--ca-stage-1); }
    .stage-2-fill { fill: var(--ca-stage-2); }
    .stage-3-fill { fill: var(--ca-stage-3); }
    .stage-4-fill { fill: var(--ca-stage-4); }
  </style>

  <defs>
    <linearGradient id="ca-path-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--ca-stage-1)"/>
      <stop offset="33%" stop-color="var(--ca-stage-2)"/>
      <stop offset="67%" stop-color="var(--ca-stage-3)"/>
      <stop offset="100%" stop-color="var(--ca-stage-4)"/>
    </linearGradient>
  </defs>

  <text class="heading" x="35" y="38">Building collective agency</text>
  <line x1="145" y1="100" x2="895" y2="100" stroke="url(#ca-path-gradient)" stroke-width="2.5" opacity="0.62"/>

