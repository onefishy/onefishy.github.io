  <text class="step" x="1135" y="153" text-anchor="middle">ASSESS</text>
  <text class="question" x="1135" y="178" text-anchor="middle"><tspan x="1135">Who benefits and</tspan><tspan x="1135" dy="18">bears risk?</tspan></text>

