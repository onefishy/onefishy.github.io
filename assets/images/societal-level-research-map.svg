  <text class="step" x="1295" y="153" text-anchor="middle">GOVERN</text>
  <text class="question" x="1295" y="178" text-anchor="middle"><tspan x="1295">What rules and</tspan><tspan x="1295" dy="18">evidence are needed?</tspan></text>

