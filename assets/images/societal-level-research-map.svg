<svg class="societal-level-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1170" width="1400" height="1170" role="img" aria-labelledby="title desc">
  <title id="title">Societal-level assurance research map</title>
  <desc id="desc">Eighteen linked publications organized by four societal-level questions: engage relevant communities, translate values into requirements, assess benefits and risks, and govern systems through rules and evidence.</desc>
  <style>
    .societal-level-map {
      --ink: #18212f;
      --muted: #5b6775;
      --rule: #d9dee7;
      --link-rule: #9aa5b3;
      --engage: #2563eb;
      --translate: #0f8a7a;
      --assess: #7c4dcc;
      --govern: #d97706;
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
    }
    .title { fill: var(--ink); font-size: 29px; font-weight: 500; }
    .note, .axis-label, .question, .insight { fill: var(--muted); }
    .note { font-size: 15px; }
    .axis-label { font-size: 14px; }
    .step { fill: var(--ink); font-size: 15px; font-weight: 500; letter-spacing: 1.5px; }
    .question { font-size: 13px; }
    .group { fill: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: 1.25px; }
    .work { fill: var(--ink); font-size: 16px; }
    .citation { font-weight: 500; }
    .guide, .group-rule { stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .group-rule { opacity: 0.95; }
    .guide { opacity: 0.72; }
    .head-rule { stroke-width: 4; vector-effect: non-scaling-stroke; }
    .engage { fill: var(--engage); stroke: var(--engage); }
    .translate { fill: var(--translate); stroke: var(--translate); }
    .assess { fill: var(--assess); stroke: var(--assess); }
    .govern { fill: var(--govern); stroke: var(--govern); }
    .dot { stroke: none; }
    .work-link { text-decoration: underline; text-decoration-color: var(--link-rule); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .work-link:hover { text-decoration-color: var(--ink); }
  </style>

  <text class="title" x="60" y="58">Societal-level assurance</text>
  <text class="note" x="60" y="90">Multiple dots mark works that answer more than one assurance question.</text>
  <text class="axis-label" x="60" y="160">Works and their societal-level insights</text>

  <line class="head-rule engage" x1="785" y1="126" x2="845" y2="126" />
  <text class="step" x="815" y="153" text-anchor="middle">ENGAGE</text>
  <text class="question" x="815" y="178" text-anchor="middle"><tspan x="815">Whose knowledge</tspan><tspan x="815" dy="18">defines the problem?</tspan></text>

