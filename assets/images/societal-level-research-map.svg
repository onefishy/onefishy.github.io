  <text class="step" x="975" y="153" text-anchor="middle">TRANSLATE</text>
  <text class="question" x="975" y="178" text-anchor="middle"><tspan x="975">How do values become</tspan><tspan x="975" dy="18">requirements?</tspan></text>

